[package]
name = "kairo-core"
version = "26.1.0"
authors = ["Flow (Florian) — FlowCreativeStudio <https://github.com/NayrolfRdgs>"]
edition = "2021"
description = "Core engine for KaïroOS arcade frontend: ROM scanner, SQLite database, CLI emulator launcher, embedded remote HTTP server"
license = "PolyForm-Noncommercial-1.0.0 OR Commercial"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled", "chrono", "uuid"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
walkdir = "2.5"
sha1 = "0.10"
md-5 = "0.10"
thiserror = "1.0"
tracing = "0.1"
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["macros", "json", "matched-path"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[dev-dependencies]
tempfile = "3.10"
